name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag points to a commit on main
        run: |
          TAG_COMMIT=$(git rev-list -n1 "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main. Aborting release."
            exit 1
          fi

  generate-notes:
    name: Generate release notes
    needs: [guard]
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header

  build:
    name: Build (${{ matrix.target }})
    needs: [guard]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-latest
            zig-target: aarch64-macos
          - target: x86_64-macos
            runner: macos-latest
            zig-target: x86_64-macos
          - target: x86_64-linux
            runner: ubuntu-22.04
            zig-target: x86_64-linux-gnu
            zig-cpu: baseline
          - target: aarch64-linux
            runner: ubuntu-22.04
            zig-target: aarch64-linux-gnu
          - target: x86_64-windows
            runner: ubuntu-22.04
            zig-target: x86_64-windows-gnu
            zig-cpu: baseline
            windows: true
          - target: aarch64-windows
            runner: ubuntu-22.04
            zig-target: aarch64-windows-gnu
            windows: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dversion=${{ github.ref_name }} -Dtarget=${{ matrix.zig-target }} ${{ matrix.zig-cpu && format('-Dcpu={0}', matrix.zig-cpu) || '' }}

      # Windows can open a .zip without extra tooling but not a .tar.gz, so
      # Windows builds ship as .zip and everything else as .tar.gz.
      - name: Package
        run: |
          if [ -n "${{ matrix.windows }}" ]; then
            ARCHIVE="drift-${{ matrix.target }}.zip"
            zip -q -j -X "$ARCHIVE" zig-out/bin/drift.exe
          else
            ARCHIVE="drift-${{ matrix.target }}.tar.gz"
            tar -czf "$ARCHIVE" -C zig-out/bin drift
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" | cut -d' ' -f1 > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" | cut -d' ' -f1 > "$ARCHIVE.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.target }}
          path: |
            drift-${{ matrix.target }}.tar.gz
            drift-${{ matrix.target }}.tar.gz.sha256
            drift-${{ matrix.target }}.zip
            drift-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  release:
    name: Create release
    needs: [guard, generate-notes, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.generate-notes.outputs.body }}
          prerelease: false
          files: |
            drift-*.tar.gz
            drift-*.tar.gz.sha256
            drift-*.zip
            drift-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Trigger Homebrew tap update
    needs: [release]
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch tap sync
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap dispatch"
            exit 0
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fiberplane/homebrew-tap/dispatches \
            -d '{"event_type":"drift-release","client_payload":{"version":"${{ github.ref_name }}"}}'
